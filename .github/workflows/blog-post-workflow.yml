name: Latest blog post workflow
on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00
  workflow_dispatch:      
permissions:
  contents: write
jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://cm-sirius.com/rss.xml"
          max_post_count: 3